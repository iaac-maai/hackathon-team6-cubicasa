<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 88 88" width="88" height="88" role="img" aria-labelledby="t">
  <title id="t">Plan precedents: a small flat with a bedroom, a kitchen and a living room</title>
  <!-- the logo of the app (03_app/public/favicon.svg) drawing itself once: outer walls, inner walls, then the rooms
       in the colours of the room key. Without motion it is simply the finished logo -->
  <style>
    .wall { stroke-dasharray: 1; animation: draw 1.1s cubic-bezier(.65, 0, .35, 1) .2s both; }
    .inner { animation-delay: 1s; animation-duration: .6s; }
    .room { transform-box: fill-box; animation: room .7s cubic-bezier(.16, 1, .3, 1) both; }
    .bed { transform-origin: left top; animation-delay: 1.4s; }
    .kitchen { transform-origin: left bottom; animation-delay: 1.6s; }
    .living { transform-origin: right center; animation-delay: 1.8s; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes room { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="16" y="16" width="88" height="88" rx="10" fill="#fff"/>
  <rect class="room bed" x="24" y="24" width="39.5" height="32.5" fill="#4477aa"/>
  <rect class="room kitchen" x="24" y="56.5" width="39.5" height="39.5" fill="#ccbb44"/>
  <rect class="room living" x="63.5" y="24" width="32.5" height="72" fill="#ee6677"/>
  <path class="wall inner" pathLength="1" d="M63.5 24v23.5 M63.5 63.5v32.5 M24 56.5h23.5" fill="none" stroke="#1b2129" stroke-width="3.5"/>
  <rect class="wall" pathLength="1" x="24" y="24" width="72" height="72" fill="none" stroke="#1b2129" stroke-width="7" stroke-linecap="square"/>
</svg>
